<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Concurrency Simulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <div class="controls">
    <div class="input-group">
      <label for="numOps">К-сть операцій (N):</label>
      <input type="number" id="numOps" value="2000" min="10" max="10000" step="100">
    </div>

    <div class="input-group">
      <label for="mode">Режим:</label>
      <select id="mode">
        <option value="all">Promise.all (повний паралелізм)</option>
        <option value="limit" selected>Ліміт (контрольована конкурентність)</option>
        <option value="seq">Послідовне виконання (у циклі)</option>
      </select>
    </div>

    <div class="input-group">
      <label for="limit">Ліміт (для Limit):</label>
      <input type="number" id="limit" value="25" min="1" max="500">
    </div>

    <button id="btnRun">Run</button>
    <button id="btnStop" disabled>Stop</button>
  </div>

  <div class="progress-container">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-text">Progress: <span id="progressText">0 / 0</span></div>
  </div>

  <div class="stats-grid">
    <div class="stat-label">Статус</div>
    <div class="stat-value"><span id="valStatus" class="badge">-</span></div>

    <div class="stat-label">Час виконання</div>
    <div class="stat-value" id="valTime">- ms</div>

    <div class="stat-label">Успішні / Помилки</div>
    <div class="stat-value" id="valCounts">- / -</div>

    <div class="stat-label">Середній час операції</div>
    <div class="stat-value"><span id="valAvg">-</span> (тільки успішні)</div>

    <div class="stat-label">Пікова конкурентність (active)</div>
    <div class="stat-value" id="valPeak">-</div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
